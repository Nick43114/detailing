<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Детейлінг-студія</title>
  <meta name="description" content="Студія детейлінгу авто: послуги та онлайн-запис">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="На головну">
      <img class="brand-logo" id="brand-logo" alt="" width="36" height="36">
      <span class="brand-text">
        <span class="brand-name" id="brand-name"></span>
        <span class="brand-tag" id="brand-tag"></span>
      </span>
    </a>
    <span class="demo-tag" id="demo-tag" hidden title="База даних не підключена: дані зберігаються лише в цьому браузері">демо</span>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Розділи">
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Головна</span>
    </a>
    <a href="#/services" data-route="services">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 5.6L20 9l-4.2 3.9L17 19l-5-3-5 3 1.2-6.1L4 9l5.6-1.4z"/></svg>
      <span>Послуги</span>
    </a>
    <a href="#/booking" data-route="booking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 13h3v3H8z"/></svg>
      <span>Запис</span>
    </a>
    <a href="#/faq" data-route="faq">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8M12 17h.01"/></svg>
      <span>Питання</span>
    </a>
    <a href="#/contacts" data-route="contacts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <span>Контакти</span>
    </a>
  </nav>

  <noscript><p style="padding:24px">Для роботи застосунку потрібен JavaScript.</p></noscript>

  <script src="studio-config.js"></script>
  <script src="core.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
